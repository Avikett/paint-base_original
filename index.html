<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>UnityPaint: Level 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>UnityPaint v0.1</h1>
    <p>Етап: створення прототипу</p>
    <!-- Aviket -->
    <div class="controls">
      <button id="brushBtn" class="tool-button active" title="Пензель">
        &#9998;
      </button>
      <button id="lineBtn" class="tool-button" title="Лінія">&#9585;</button>
      <button id="rectBtn" class="tool-button" title="Прямокутник">
        &#9645;
      </button>
      <button id="circleBtn" class="tool-button" title="Коло">&#9711;</button>
      <button id="fillBtn" class="tool-button" title="Заливка">
        &#129683;
      </button>
      <input
        type="color"
        id="colorPicker"
        value="#000000"
        class="tool-button"
        title="Оберіть колір"
      />
      <input type="range" id="lineWidth" min="1" max="10" value="5" />
      <span id="sizeValue">5px</span>
      <button id="clearBtn" class="tool-button" title="Очистити полотно">
        &#128465;
      </button>

      <button id="eraserBtn" class="tool-button" title="Ластик">
        &#129521;
        <!-- Емодзі гумки -->
      </button>

      <button id="undoBtn" class="tool-button" title="Скасувати (Ctrl+Z)">
        &#8630;
      </button>
      <button id="redoBtn" class="tool-button" title="Повторити (Ctrl+Y)">
        &#8631;
      </button>
    </div>

    <canvas id="board" width="500" height="400"></canvas>
    <script src="script.js"></script>
  </body>
</html>
