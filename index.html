<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>UnityPaint: Level 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top-bar">
      <div class="system-actions">
        <button id="undoBtn" class="tool-button" title="Скасувати (Ctrl+Z)">
          &#8630;
        </button>
        <button id="redoBtn" class="tool-button" title="Повторити (Ctrl+Y)">
          &#8631;
        </button>
        <button id="clearBtn" class="tool-button" title="Очистити полотно">
          🗑️
        </button>
        <button
          id="exportBtn"
          class="tool-button"
          title="Завантажити малюнок (PNG)"
        >
          💾
        </button>
        <button
          id="importBtn"
          class="tool-button"
          title="Відкрити малюнок з файлу"
        >
          📂
        </button>
        <input
          type="file"
          id="fileInput"
          accept="image/*"
          style="display: none"
        />
      </div>
      <div class="app-info">
        <span class="app-title">UnityPaint v0.2</span>
        <span class="app-stage"
          >Етап: розширення архітектури та ергономіка</span
        >
      </div>
      <div class="top-right-placeholder"></div>
      <button id="gridBtn" class="tool-button" title="Увімкнути/Вимкнути сітку">
        🌐
      </button>
    </div>
    <div class="main-container">
      <div class="left-toolbar">
        <button id="brushBtn" class="tool-button active" title="Пензель">
          🖌️
        </button>
        <button id="lineBtn" class="tool-button" title="Лінія">📏</button>
        <button id="rectBtn" class="tool-button" title="Прямокутник">🔲</button>
        <button id="circleBtn" class="tool-button" title="Коло">🟠</button>
        <button
          id="polygonBtn"
          class="tool-button"
          title="Довільний багатокутник (Ламана)"
        >
          ⬡
        </button>
        <button id="fillBtn" class="tool-button" title="Заливка">🪣</button>
        <button id="eraserBtn" class="tool-button" title="Ластик">🧽</button>
        <input
          type="color"
          id="colorPicker"
          value="#000000"
          class="tool-button"
          title="Оберіть колір"
        />
        <select id="lineWidth" class="tool-button" title="Товщина лінії">
          <option value="1">1px</option>
          <option value="3">3px</option>
          <option value="5" selected>5px</option>
          <option value="8">8px</option>
          <option value="10">10px</option>
        </select>
        <span id="sizeValue">5px</span>
      </div>
      <div class="canvas-workspace">
        <canvas id="board" width="700" height="500"></canvas>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
